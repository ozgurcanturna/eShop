# Prometheus + Grafana monitoring stack
# Kullanım: docker compose -f docker-compose.yaml -f docker-compose.monitoring.yml up -d
# Not: Ana docker-compose.yaml dosyası Aspire tarafından üretilir ve değiştirilemez.
#      Monitoring servisleri bu override dosyasında tanımlanmıştır.

services:
  prometheus:
    image: "prom/prometheus:latest"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - "../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "9090:9090"
    networks:
      - "aspire"
    restart: "always"

  grafana:
    image: "grafana/grafana-oss:latest"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - "../grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports:
      - "3000:3000"
    depends_on:
      - "prometheus"
    networks:
      - "aspire"
    restart: "always"
